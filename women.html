<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Beauty & Style - Curated Finds</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-yellow: #F59E0B;
            --button-bg: #FBBF24;
            --button-text: #0F172A;
            --border-radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; justify-content: center; padding: 24px 16px 40px; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; }
        .page-header { text-align: center; margin-bottom: 32px; }
        .page-title { font-size: 26px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .page-subtitle { font-size: 15px; color: var(--text-secondary); max-width: 480px; margin: 0 auto; }
        .categories-label { width: 100%; text-align: center; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); margin-bottom: 16px; }
        .choices-row { width: 100%; max-width: 550px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 28px; }
        .choice-btn { flex: 1 1 140px; text-align: center; padding: 14px 20px; background-color: #FFFFFF; color: #1E3A8A; border: 1px solid #DCE6F1; border-radius: 14px; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03); transition: all 0.2s ease; }
        .choice-btn:hover { background-color: var(--button-bg); color: var(--button-text); border-color: var(--button-bg); transform: translateY(-3px); box-shadow: 0 6px 16px rgba(251, 191, 36, 0.25); }
        .footer { margin-top: 40px; font-size: 12px; color: #64748B; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">💄 Women's Beauty & Style</h1>
            <p class="page-subtitle">My daily top picks for makeup, skincare & viral beauty finds — curated just for you.</p>
        </div>
        
        <div class="categories-label">Browse by Category</div>
        <div class="choices-row">
            <a href="face.html" class="choice-btn">✨ Face</a>
            <a href="eyes.html" class="choice-btn">👁️ Eyes</a>
            <a href="lips.html" class="choice-btn">💋 Lips</a>
        </div>

        <div class="footer">
            <p>© 2026 • As an affiliate, I earn from qualifying purchases.</p>
        </div>
    </div>
</body>
</html>
