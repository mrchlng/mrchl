<script>
    // AWTO-SHUFFLE SA BAWAT OPEN AT REFRESH
    document.addEventListener("DOMContentLoaded", () => {
        const grid = document.getElementById('productsGrid');
        // Kukunin ang lahat ng product cards
        const cards = Array.from(grid.querySelectorAll('.product-card'));
        
        // Fisher-Yates Shuffle Algorithm (Awtomatikong bina-basa at gina-galaw ang cards)
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = cards[i];
            cards[i] = cards[j];
            cards[j] = temp;
        }

        // I-reinsert ang cards sa grid batay sa bagong randomized order
        cards.forEach(card => grid.appendChild(card));
    });

    // SEARCH AT CATEGORY FILTER LOGIC
    const searchInput = document.getElementById('searchInput');
    const choiceBtns = document.querySelectorAll('.choice-btn');
    const noResults = document.getElementById('noResults');

    let activeCategory = null;

    function filterProducts() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const productCards = document.querySelectorAll('.product-card');
        let visibleCount = 0;

        productCards.forEach(card => {
            const title = card.querySelector('.product-title').textContent.toLowerCase();
            const desc = card.querySelector('.product-desc').textContent.toLowerCase();
            const cardCategory = card.getAttribute('data-category');

            const matchesSearch = title.includes(searchTerm) || desc.includes(searchTerm) || cardCategory.includes(searchTerm);
            const matchesCategory = !activeCategory || cardCategory === activeCategory;

            if (matchesSearch && matchesCategory) {
                card.style.display = 'flex';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        if (visibleCount === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
        }
    }

    searchInput.addEventListener('input', filterProducts);

    choiceBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const category = btn.getAttribute('data-category');

            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                activeCategory = null;
            } else {
                choiceBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategory = category;
            }

            filterProducts();
        });
    });
</script>
