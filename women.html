<!DOCTYPE html>
<html lang="en">
<head>

    <title>Eye Makeup Finds - Curated Finds</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-yellow: #F59E0B;
            --button-bg: #FBBF24;
            --button-text: #0F172A;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; justify-content: center; padding: 24px 16px 40px; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; }

        .nav-header { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #1E3A8A; font-size: 13px; font-weight: 700; padding: 8px 14px; background-color: #FFFFFF; border-radius: 20px; border: 1px solid #DCE6F1; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04); transition: all 0.2s ease; }
        .back-btn:hover { transform: translateX(-2px); border-color: var(--button-bg); }

        .page-header { text-align: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); max-width: 400px; margin: 0 auto; }

        .products-grid { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .product-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; border: 1px solid #DCE6F1; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); transition: transform 0.2s ease, box-shadow 0.2s ease; height: 100%; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08); border-color: var(--button-bg); }
        .product-img { width: 100%; height: 140px; border-radius: 12px; object-fit: cover; background-color: #F1F5F9; margin-bottom: 10px; }
        .product-info { width: 100%; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .product-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; line-height: 1.3; min-height: 36px; display: flex; align-items: center; justify-content: center; }
        .product-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.35; margin-bottom: 12px; min-height: 32px; display: flex; align-items: center; justify-content: center; }

        .buy-btn { display: block; width: 100%; padding: 9px 0; background-color: var(--button-bg); color: var(--button-text); text-decoration: none; font-size: 12px; font-weight: 700; border-radius: 8px; text-align: center; box-shadow: 0 2px 6px rgba(251, 191, 36, 0.3); transition: background-color 0.15s ease; margin-top: auto; }
        .buy-btn:hover { background-color: var(--accent-yellow); }

        /* Tablet Layout */
        @media (min-width: 640px) {
            .container { max-width: 95%; }
            .products-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
        }

        /* PC / Large Desktop Layout (6 items per row) */
        @media (min-width: 1024px) {
            .container { max-width: 1350px; }
            .products-grid { grid-template-columns: repeat(6, 1fr); gap: 16px; }
            .product-card { padding: 16px; border-radius: 18px; }
            .product-img { height: 155px; border-radius: 12px; margin-bottom: 12px; }
            .product-title { font-size: 13px; min-height: 38px; font-weight: 700; }
            .product-desc { font-size: 11px; min-height: 34px; margin-bottom: 14px; }
            .buy-btn { padding: 10px 0; font-size: 12px; border-radius: 10px; }
        }

        .footer { margin-top: 40px; font-size: 12px; color: #64748B; text-align: center; }
    </style>
</head>
<body>

    <div class="container">

                <div class="product-info">
                    <div class="product-title">Volumizing Lash Mascara</div>
                    <div class="product-desc">Lifts and lengthens lashes without smudging or clumping.</div>

            </div>

        </div>

        <div class="footer">
            <p>© 2026 • As an affiliate, I earn from qualifying purchases.</p>

    </div>

</body>
</html>
