<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face & Skincare Finds</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-yellow: #F59E0B;
            --button-bg: #FBBF24;
            --button-text: #0F172A;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 32px 16px 48px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Back Button Style */
        .nav-wrapper {
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            background-color: var(--card-bg);
            color: var(--text-primary);
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid #DCE6F1;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        /* Header Style */
        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* Search Bar Style */
        .search-container {
            width: 100%;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 50px;
            border: 1px solid #DCE6F1;
            background-color: var(--card-bg);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--button-bg);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
        }

        /* Product List Container */
        .products-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Product Item Card */
        .product-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            border: 1px solid #DCE6F1;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }

        .product-img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 16px;
            background-color: #F1F5F9;
            flex-shrink: 0;
        }

        .product-info {
            flex-grow: 1;
        }

        .product-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .product-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .buy-btn {
            padding: 8px 16px;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(251, 191, 36, 0.3);
            white-space: nowrap;
            margin-left: 12px;
            transition: background-color 0.15s ease;
        }

        .buy-btn:hover {
            background-color: var(--accent-yellow);
        }

        /* No Results Message */
        .no-results {
            display: none;
            width: 100%;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BACK BUTTON -->
        <div class="nav-wrapper">
            <a href="../women.html" class="back-btn">← Back</a>
        </div>

        <!-- HEADER -->
        <div class="header">
            <h1>✨ Face & Skincare</h1>
            <p>Curated skincare essentials, sunscreens, and base makeup picks.</p>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search face products..." onkeyup="filterProducts()">
        </div>

        <!-- PRODUCTS LIST -->
        <div class="products-list" id="productsList">

            <!-- SAMPLE PRODUCT 1 (Palitan mo ng tunay mong produkto/links) -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=200&auto=format&fit=crop&q=80" alt="Product Image" class="product-img">
                <div class="product-info">
                    <div class="product-title">Everyday Sunscreen SPF 50</div>
                    <div class="product-desc">Lightweight, non-greasy UV shield for all skin types.</div>
                </div>
                <a href="#" target="_blank" class="buy-btn">Shop Now →</a>
            </div>

            <!-- SAMPLE PRODUCT 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1608248597260-657d6540d993?w=200&auto=format&fit=crop&q=80" alt="Product Image" class="product-img">
                <div class="product-info">
                    <div class="product-title">Hydrating Skin Tint</div>
                    <div class="product-desc">Natural glow base with sheer-to-medium coverage.</div>
                </div>
                <a href="#" target="_blank" class="buy-btn">Shop Now →</a>
            </div>

        </div>

        <!-- NO RESULTS MESSAGE -->
        <div id="noResults" class="no-results">
            No products found.
        </div>
    </div>

    <!-- JAVASCRIPT PARA SA SEARCH BAR FUNCTION -->
    <script>
        function filterProducts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            let hasVisibleCard = false;

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.product-title').innerText.toLowerCase();
                const desc = cards[i].querySelector('.product-desc').innerText.toLowerCase();

                if (title.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "flex";
                    hasVisibleCard = true;
                } else {
                    cards[i].style.display = "none";
                }
            }

            const noResults = document.getElementById('noResults');
            if (hasVisibleCard) {
                noResults.style.display = "none";
            } else {
                noResults.style.display = "block";
            }
        }
    </script>

</body>
</html>
