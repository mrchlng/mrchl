<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-yellow: #F59E0B;
            --button-bg: #FBBF24;
            --button-text: #0F172A;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 32px 16px 48px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Back Button */
        .nav-wrapper {
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            background-color: var(--card-bg);
            color: var(--text-primary);
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid #DCE6F1;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        /* Detail Card Layout */
        .product-detail-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            width: 100%;
            border: 1px solid #DCE6F1;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .product-detail-card {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .product-detail-img {
            width: 100%;
            max-width: 280px;
            height: 280px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #F1F5F9;
            align-self: center;
        }

        .product-detail-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Section Box (Why We Like It & Best For) */
        .section-box {
            background-color: #F8FAFC;
            border-left: 4px solid var(--button-bg);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.3);
            margin-top: 12px;
            transition: background-color 0.15s ease;
        }

        .buy-btn:hover {
            background-color: var(--accent-yellow);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BACK BUTTON -->
        <div class="nav-wrapper">
            <a href="face.html" class="back-btn">← Back to Face Menu</a>
        </div>

        <!-- PRODUCT DETAIL CARD -->
        <div class="product-detail-card">
            <img id="itemImg" src="" alt="Product Image" class="product-detail-img">
            
            <div class="product-detail-info">
                <h1 id="itemTitle" class="product-title">Loading...</h1>
                <p id="itemDesc" class="product-desc"></p>

                <!-- WHY WE LIKE IT -->
                <div class="section-box">
                    <div class="section-title">💖 Why We Like It</div>
                    <p id="itemWhyLike" class="section-text"></p>
                </div>

                <!-- BEST FOR -->
                <div class="section-box">
                    <div class="section-title">✨ Best For</div>
                    <p id="itemBestFor" class="section-text"></p>
                </div>

                <!-- BUY BUTTON -->
                <a id="itemBuyLink" href="#" target="_blank" class="buy-btn">Buy Product Now →</a>
            </div>
        </div>
    </div>

    <script>
        // DATOS NG MGA PRODUKTO (Dito mo papalitan ang mga detalye, larawan, at link ng affiliate)
        const productsData = {
            "sunscreen": {
                title: "Everyday Sunscreen SPF 50",
                img: "https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=500&auto=format&fit=crop&q=80",
                desc: "A broad-spectrum daily SPF 50 sunscreen designed for ultimate protection without leaving any white cast or sticky feeling.",
                whyLike: "It blends effortlessly like a lightweight moisturizer, absorbs fast, and works seamlessly under makeup.",
                bestFor: "Daily sun protection, oily and combination skin types, and underneath makeup.",
                link: "https://example.com/sunscreen-link"
            },
            "skintint": {
                title: "Hydrating Skin Tint",
                img: "https://images.unsplash.com/photo-1608248597260-657d6540d993?w=500&auto=format&fit=crop&q=80",
                desc: "A sheer-to-medium coverage skin tint infused with hyaluronic acid for an instant dewy glow.",
                whyLike: "Gives that effortlessly healthy 'no-makeup makeup' look while keeping skin moisturized all day.",
                bestFor: "Dry or dull skin, quick daily routines, and a fresh natural glow.",
                link: "https://example.com/skintint-link"
            },
            "cleanser": {
                title: "Soothing Cleanser",
                img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500&auto=format&fit=crop&q=80",
                desc: "A gentle gel cleanser that lifts away dirt and oil without stripping away essential skin moisture.",
                whyLike: "Leaves the skin feeling calm, clean, and balanced without any tightness or irritation.",
                bestFor: "Sensitive skin, morning cleanses, and soothing breakouts.",
                link: "https://example.com/cleanser-link"
            },
            "serum": {
                title: "Glow Serum",
                img: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=80",
                desc: "A powerful brightening serum loaded with Vitamin C and niacinamide to even out skin tone.",
                whyLike: "Visibly fades dark spots and leaves a radiant, lit-from-within glow after just a few uses.",
                bestFor: "Uneven skin tone, hyperpigmentation, and dullness.",
                link: "https://example.com/serum-link"
            },
            "moisturizer": {
                title: "Barrier Moisturizer",
                img: "https://images.unsplash.com/photo-1571781926291-c477ebfd024b?w=500&auto=format&fit=crop&q=80",
                desc: "A rich moisturizer formulated with ceramides to strengthen and restore damaged skin barriers.",
                whyLike: "Provides long-lasting moisture lock without clogging pores or feeling too heavy.",
                bestFor: "Dry skin, compromised skin barriers, and night-time hydration.",
                link: "https://example.com/moisturizer-link"
            }
        };

        // KINUKUHA ANG URL PARAMETER
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // IPINAPAKITA ANG TAMANG DETALYE SA PAGE
        if (productId && productsData[productId]) {
            const item = productsData[productId];
            document.getElementById('itemTitle').innerText = item.title;
            document.getElementById('itemImg').src = item.img;
            document.getElementById('itemDesc').innerText = item.desc;
            document.getElementById('itemWhyLike').innerText = item.whyLike;
            document.getElementById('itemBestFor').innerText = item.bestFor;
            document.getElementById('itemBuyLink').href = item.link;
            document.title = item.title + " | Details";
        } else {
            document.getElementById('itemTitle').innerText = "Product Not Found";
            document.getElementById('itemDesc').innerText = "Please go back to the face menu and select a product.";
        }
    </script>

</body>
</html>
