<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face & Skincare</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-yellow: #F59E0B;
            --button-bg: #FBBF24;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 32px 16px 48px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Back Button Style */
        .nav-wrapper {
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            background-color: var(--card-bg);
            color: var(--text-primary);
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid #DCE6F1;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        /* Header Style */
        .header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* Vertical List Container */
        .categories-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Card Style */
        .category-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            border: 1px solid #DCE6F1;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
            border-color: #CBD5E1;
        }

        .card-icon {
            font-size: 24px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
        }

        .card-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .card-arrow {
            font-size: 16px;
            color: var(--text-primary);
            margin-left: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BACK BUTTON PAPUNTANG WOMEN MENU (Gamit ang ../ para lumabas ng face folder) -->
        <div class="nav-wrapper">
            <a href="../women.html" class="back-btn">← Back</a>
        </div>

        <!-- HEADER -->
        <div class="header">
            <h1>✨ Face & Skincare</h1>
            <p>Explore everyday sunscreens, glowing base makeup, and essential skincare products.</p>
        </div>

        <!-- LIST NG MGA ITEMS O SUB-COLLECTIONS SA FACE -->
        <div class="categories-list">

            <!-- ITEM 1: SUNSCREENS (Halimbawa ng Benable list mo) -->
            <a href="#" class="category-card">
                <div class="card-icon">☀️</div>
                <div class="card-info">
                    <div class="card-title">Best Face Sunscreens</div>
                    <div class="card-desc">Non-sticky, lightweight UV protection for everyday wear.</div>
                </div>
                <div class="card-arrow">→</div>
            </a>

            <!-- ITEM 2: BASE MAKEUP -->
            <a href="#" class="category-card">
                <div class="card-icon">✨</div>
                <div class="card-info">
                    <div class="card-title">Glow Filters & Foundations</div>
                    <div class="card-desc">Skin tints, lightweight cushions, and flawless base makeup.</div>
                </div>
                <div class="card-arrow">→</div>
            </a>

        </div>
    </div>

</body>
</html>
