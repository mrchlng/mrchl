<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Beauty Categories</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --button-bg: #FBBF24;
            --button-text: #0F172A;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 24px 16px 40px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 16px;
            color: #1E3A8A;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .categories-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .categories-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .category-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #DCE6F1;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .category-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .category-card p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 10px 0;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LINK PABALIK SA MAIN INDEX.HTML (Gamit ang ../) -->
        <div class="header">
            <a href="../index.html" class="back-btn">← Back to Home</a>
            <h1>💄 Women's Beauty</h1>
            <p>Select a category to explore</p>
        </div>

        <div class="categories-grid">

            <!-- FACE CATEGORY LINK -->
            <div class="category-card">
                <h3>✨ Face</h3>
                <p>Foundations, sunscreens & skincare picks.</p>
                <!-- DITO NAKA-LINK ANG FACE -->
                <a href="face/face.html" class="buy-btn">Explore Face</a>
            </div>

            <!-- EYES CATEGORY LINK -->
            <div class="category-card">
                <h3>👁️ Eyes</h3>
                <p>Mascaras, eyeliners & eyeshadows.</p>
                <!-- DITO NAKA-LINK ANG EYES -->
                <a href="eyes/eyes.html" class="buy-btn">Explore Eyes</a>
            </div>

            <!-- LIPS CATEGORY LINK -->
            <div class="category-card">
                <h3>💋 Lips</h3>
                <p>Lipsticks, lip oils & tints.</p>
                <!-- DITO NAKA-LINK ANG LIPS -->
                <a href="lips/lips.html" class="buy-btn">Explore Lips</a>
            </div>

        </div>
    </div>

</body>
</html>
