<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Finds - Affiliate Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-yellow: #F59E0B;
            --button-bg: #FBBF24;
            --button-text: #0F172A;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; justify-content: center; padding: 32px 16px 40px; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }

        .hero-section { text-align: center; margin-bottom: 28px; width: 100%; }
        .site-title { font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .site-subtitle { font-size: 14px; color: var(--text-secondary); max-width: 420px; margin: 0 auto; line-height: 1.5; }

        .category-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
        .category-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 18px 20px; text-decoration: none; color: var(--text-primary); display: flex; align-items: center; justify-content: space-between; border: 1px solid #DCE6F1; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); transition: transform 0.2s ease, border-color 0.2s ease; }
        .category-card:hover { transform: translateY(-2px); border-color: var(--button-bg); }
        .category-info { display: flex; align-items: center; gap: 14px; }
        .category-icon { font-size: 24px; }
        .category-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
        .category-arrow { font-size: 14px; font-weight: 700; color: #1E3A8A; }

        .footer { margin-top: 40px; font-size: 12px; color: #64748B; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-section">
            <h1 class="site-title">✨ Curated Finds</h1>
            <p class="site-subtitle">Discover top-rated beauty, skincare, and everyday essentials.</p>
        </div>

        <div class="category-list">
            <a href="women/women.html" class="category-card">
                <div class="category-info">
                    <span class="category-icon">💄</span>
                    <span class="category-name">Women's Beauty & Skincare</span>
                </div>
                <span class="category-arrow">Explore →</span>
            </a>
        </div>

        <div class="footer">
            <p>© 2026 • As an affiliate, I earn from qualifying purchases.</p>
        </div>
    </div>

</body>
</html>
