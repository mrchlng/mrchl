<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face & Skincare Finds</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #FDF9F8;
            --accent-peach: #FCEBE6;
            --dark-button: #1C1E23;
            --gray-pill: #EAEBED;
            --text-dark: #121212;
            --text-muted: #737373;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        /* Responsive Container */
        .app-container {
            width: 100%;
            max-width: 1000px;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--text-dark);
            text-decoration: none;
        }

        /* Gender / Category Tabs */
        .gender-tabs-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .gender-tabs {
            display: flex;
            background: var(--gray-pill);
            padding: 4px;
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--dark-button);
            color: #FFFFFF;
        }

        /* Hero Banner */
        .hero-banner {
            background-color: var(--accent-peach);
            border-radius: 20px;
            padding: 25px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            min-height: 160px;
        }

        .hero-content {
            max-width: 60%;
            z-index: 2;
        }

        .hero-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .hero-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .hero-btn {
            display: inline-block;
            background: var(--dark-button);
            color: #FFFFFF;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .hero-img {
            position: absolute;
            right: -10px;
            bottom: 0;
            height: 100%;
            width: 40%;
            object-fit: cover;
            object-position: top;
        }

        /* Section Titles */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .see-all {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
        }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .category-icon {
            width: 100%;
            height: 65px;
            background: #F7F7F8;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            font-size: 20px;
            color: var(--text-dark);
        }

        .category-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dark);
            text-align: center;
        }

        /* Products Grid (Trending Finds) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: #F7F7F8;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            height: 200px;
            text-decoration: none;
            display: block;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Layout adjustment sa Desktop / PC Screen */
        @media (min-width: 768px) {
            .app-container {
                padding: 35px 40px;
            }
            .hero-banner {
                padding: 40px;
                min-height: 220px;
            }
            .hero-title {
                font-size: 28px;
            }
            .hero-desc {
                font-size: 14px;
            }
            .category-icon {
                height: 85px;
                font-size: 24px;
            }
            .category-label {
                font-size: 13px;
            }
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
            .product-card {
                height: 260px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Logo Header (Walang Cart) -->
        <header class="header">
            <a href="index.html" class="logo">asos</a>
        </header>

        <!-- Category Tabs -->
        <div class="gender-tabs-wrapper">
            <div class="gender-tabs">
                <a href="index.html" class="tab active">Women</a>
                <a href="#" class="tab">Men</a>
            </div>
        </div>

        <!-- Hero Banner -->
        <div class="hero-banner">
            <div class="hero-content">
                <span class="hero-tag">New in</span>
                <h1 class="hero-title">Spring Essentials</h1>
                <p class="hero-desc">Discover new styles to embrace this exciting season!</p>
                <a href="#trending" class="hero-btn">Explore Now</a>
            </div>
            <img class="hero-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400" alt="Model">
        </div>

        <!-- Categories -->
        <div class="section-header">
            <h2 class="section-title">Category</h2>
            <a href="#" class="see-all">See all</a>
        </div>

        <div class="categories-grid">
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-shirt"></i></div>
                <span class="category-label">Dresses</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-vest"></i></div>
                <span class="category-label">Tops</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-shoe-prints"></i></div>
                <span class="category-label">Shoes</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <span class="category-label">Beauty</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                <span class="category-label">Accessories</span>
            </a>
        </div>

        <!-- Trending Section -->
        <div class="section-header" id="trending">
            <h2 class="section-title">Trending Now</h2>
            <a href="#" class="see-all">See all</a>
        </div>

        <div class="products-grid">
            <a href="#" class="product-card">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=400" alt="Product">
            </a>
            <a href="#" class="product-card">
                <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&q=80&w=400" alt="Product">
            </a>
            <a href="#" class="product-card">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&q=80&w=400" alt="Product">
            </a>
            <a href="#" class="product-card">
                <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&q=80&w=400" alt="Product">
            </a>
        </div>

    </div>

</body>
</html>
