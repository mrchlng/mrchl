<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASOS - Online Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #FDF9F8;
            --card-bg: #FFFFFF;
            --accent-peach: #FCEBE6;
            --dark-button: #1C1E23;
            --gray-pill: #EAEBED;
            --text-dark: #121212;
            --text-muted: #737373;
            --light-border: #F0F0F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* Mobile Container Simulation */
        .app-container {
            width: 100%;
            max-width: 390px;
            background: #FFFFFF;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 20px 20px 90px 20px;
            position: relative;
            overflow: hidden;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--text-dark);
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            background: #F7F7F8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 16px;
        }

        /* Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #F7F7F8;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 16px;
        }

        .search-box input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 14px;
            color: var(--text-dark);
        }

        .search-box input::placeholder {
            color: #A0A0A0;
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            font-size: 14px;
        }

        /* Tabs (Women / Men) */
        .gender-tabs {
            display: flex;
            background: var(--gray-pill);
            padding: 4px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--dark-button);
            color: #FFFFFF;
        }

        /* Hero Banner */
        .hero-banner {
            background-color: var(--accent-peach);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
            min-height: 160px;
        }

        .hero-content {
            width: 60%;
            z-index: 2;
        }

        .hero-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .hero-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .hero-btn {
            display: inline-block;
            background: var(--dark-button);
            color: #FFFFFF;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .hero-img {
            position: absolute;
            right: -10px;
            bottom: 0;
            height: 100%;
            width: 45%;
            object-fit: cover;
            object-position: top;
        }

        /* Section Titles */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .see-all {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
        }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .category-icon {
            width: 58px;
            height: 58px;
            background: #F7F7F8;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            overflow: hidden;
        }

        .category-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .category-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dark);
        }

        /* Trending Cards Grid */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .product-card {
            background: #F7F7F8;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            height: 180px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wishlist-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 12px;
            text-decoration: none;
        }

        /* Bottom Floating Navbar */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .nav-item {
            color: var(--text-dark);
            font-size: 18px;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 20px;
        }

        .nav-item.active {
            background: var(--dark-button);
            color: #FFFFFF;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header -->
        <header class="header">
            <div class="logo">asos</div>
            <div class="header-icons">
                <a href="#" class="icon-btn"><i class="fa-regular fa-heart"></i></a>
                <a href="#" class="icon-btn"><i class="fa-solid fa-bag-shopping"></i></a>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search for brands, styles...">
            <button class="filter-btn"><i class="fa-sliders fa-solid"></i></button>
        </div>

        <!-- Gender Tabs -->
        <div class="gender-tabs">
            <a href="women.html" class="tab active">Women</a>
            <a href="#" class="tab">Men</a>
        </div>

        <!-- Hero Banner -->
        <div class="hero-banner">
            <div class="hero-content">
                <span class="hero-tag">New in</span>
                <h2 class="hero-title">Spring Essentials</h2>
                <p class="hero-desc">Discover new styles to embrace this exciting season!</p>
                <a href="#" class="hero-btn">Shop Now</a>
            </div>
            <!-- Palitan ang image link sa kahit anong model photo -->
            <img class="hero-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400" alt="Model">
        </div>

        <!-- Category Section -->
        <div class="section-header">
            <h3 class="section-title">Category</h3>
            <a href="#" class="see-all">See all</a>
        </div>

        <div class="categories-grid">
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-shirt"></i></div>
                <span class="category-label">Dresses</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-vest"></i></div>
                <span class="category-label">Tops</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-shoe-prints"></i></div>
                <span class="category-label">Shoes</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <span class="category-label">Beauty</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                <span class="category-label">Accessories</span>
            </a>
        </div>

        <!-- Trending Now Section -->
        <div class="section-header">
            <h3 class="section-title">Trending Now</h3>
            <a href="#" class="see-all">See all</a>
        </div>

        <div class="products-grid">
            <div class="product-card">
                <a href="#" class="wishlist-btn"><i class="fa-regular fa-heart"></i></a>
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=400" alt="Product">
            </div>
            <div class="product-card">
                <a href="#" class="wishlist-btn"><i class="fa-regular fa-heart"></i></a>
                <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&q=80&w=400" alt="Product">
            </div>
        </div>

        <!-- Floating Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i></a>
            <a href="#" class="nav-item"><i class="fa-regular fa-heart"></i></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-bag-shopping"></i></a>
            <a href="#" class="nav-item"><i class="fa-regular fa-user"></i></a>
        </nav>
    </div>

</body>
</html>
