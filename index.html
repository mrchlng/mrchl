<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASOS - Online Shopping (PC Version)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #FDF9F8;
            --card-bg: #FFFFFF;
            --accent-peach: #FCEBE6;
            --dark-button: #1C1E23;
            --gray-pill: #EAEBED;
            --text-dark: #121212;
            --text-muted: #737373;
            --light-border: #F0F0F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Container - Malapad para sa PC */
        .app-container {
            width: 100%;
            max-width: 1200px; /* Pang Desktop width */
            background: #FFFFFF;
            padding: 30px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            min-height: 100vh;
        }

        /* Header Layout sa PC */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--text-dark);
        }

        /* Search Bar sa PC */
        .search-box {
            flex: 1;
            max-width: 500px;
            display: flex;
            align-items: center;
            background: #F7F7F8;
            padding: 12px 20px;
            border-radius: 16px;
            gap: 12px;
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 16px;
        }

        .search-box input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 14px;
            color: var(--text-dark);
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            font-size: 14px;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            background: #F7F7F8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 18px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--gray-pill);
        }

        /* Gender Tabs */
        .gender-tabs-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .gender-tabs {
            display: flex;
            background: var(--gray-pill);
            padding: 4px;
            border-radius: 16px;
            width: 300px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--dark-button);
            color: #FFFFFF;
        }

        /* Hero Banner sa PC */
        .hero-banner {
            background-color: var(--accent-peach);
            border-radius: 24px;
            padding: 40px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
            height: 280px;
        }

        .hero-content {
            max-width: 50%;
            z-index: 2;
        }

        .hero-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .hero-btn {
            display: inline-block;
            background: var(--dark-button);
            color: #FFFFFF;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .hero-btn:hover {
            opacity: 0.9;
        }

        .hero-img {
            position: absolute;
            right: 40px;
            bottom: 0;
            height: 100%;
            width: 350px;
            object-fit: cover;
            object-position: top;
        }

        /* Section Titles */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .see-all {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
        }

        /* Categories Grid sa PC (5 columns na mas malalaki) */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .category-icon {
            width: 100%;
            height: 90px;
            background: #F7F7F8;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 24px;
            color: var(--text-dark);
            transition: 0.2s;
        }

        .category-item:hover .category-icon {
            background: var(--gray-pill);
        }

        .category-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Trending Cards Grid sa PC (4 columns) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product-card {
            background: #F7F7F8;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            height: 280px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover img {
            transform: scale(1.03);
        }

        .wishlist-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 14px;
            text-decoration: none;
            z-index: 2;
        }

        /* Responsive Breakpoint (Para sa katamtamang screen gaya ng Laptop) */
        @media (max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .hero-img {
                width: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header Navigation -->
        <header class="header">
            <div class="logo">asos</div>
            
            <!-- Search Bar sa Gitna -->
            <div class="search-box">

                <button class="filter-btn"><i class="fa-sliders fa-solid"></i></button>
            </div>

            <!-- Header Action Icons -->
            <div class="header-icons">
                <a href="index.html" class="icon-btn" title="Home"><i class="fa-solid fa-house"></i></a>
                <a href="#" class="icon-btn" title="Wishlist"><i class="fa-regular fa-heart"></i></a>

                <a href="#" class="icon-btn" title="Profile"><i class="fa-regular fa-user"></i></a>

        <!-- Gender Switcher -->
        <div class="gender-tabs-wrapper">

        <div class="hero-banner">

        <!-- Categories Section -->
        <div class="section-header">
            <h2 class="section-title">Category</h2>
            <a href="#" class="see-all">See all</a>
        </div>

        <div class="categories-grid">
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-shirt"></i></div>

            <a href="#" class="category-item">

            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-shoe-prints"></i></div>
                <span class="category-label">Shoes</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <span class="category-label">Beauty</span>
            </a>
            <a href="#" class="category-item">
                <div class="category-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                <span class="category-label">Accessories</span>
            </a>
        </div>

        <!-- Trending Now Grid -->
        <div class="section-header">
            <h2 class="section-title">Trending Now</h2>
            <a href="#" class="see-all">See all</a>
        </div>

        <div class="products-grid">
            <div class="product-card">
                <a href="#" class="wishlist-btn"><i class="fa-regular fa-heart"></i></a>
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=400" alt="Product">
            </div>
            <div class="product-card">
                <a href="#" class="wishlist-btn"><i class="fa-regular fa-heart"></i></a>
                <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&q=80&w=400" alt="Product">
            </div>
            <div class="product-card">
                <a href="#" class="wishlist-btn"><i class="fa-regular fa-heart"></i></a>

            </div>
            <div class="product-card">
                <a href="#" class="wishlist-btn"><i class="fa-regular fa-heart"></i></a>

        </div>

    </div>

</body>
</html>
