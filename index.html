<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PALITAN ANG TITLE NG PRODUCT MO -->
    <title>Product Name - Curated Finds</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF3FA;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-yellow: #F59E0B;
            --button-bg: #FBBF24;
            --button-text: #0F172A;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; justify-content: center; padding: 24px 16px 40px; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; align-items: center; }

        .nav-header { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #1E3A8A; font-size: 13px; font-weight: 700; padding: 8px 14px; background-color: #FFFFFF; border-radius: 20px; border: 1px solid #DCE6F1; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04); transition: all 0.2s ease; }
        .back-btn:hover { transform: translateX(-2px); border-color: var(--button-bg); }

        .product-detail-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 24px; width: 100%; border: 1px solid #DCE6F1; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .product-img { width: 100%; max-height: 320px; border-radius: 12px; object-fit: cover; background-color: #F1F5F9; margin-bottom: 20px; }
        .product-title { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
        .product-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; }
        
        .buy-btn { display: block; width: 100%; padding: 14px 0; background-color: var(--button-bg); color: var(--button-text); text-decoration: none; font-size: 14px; font-weight: 700; border-radius: 10px; text-align: center; box-shadow: 0 4px 10px rgba(251, 191, 36, 0.3); transition: background-color 0.15s ease; }
        .buy-btn:hover { background-color: var(--accent-yellow); }

        .footer { margin-top: 40px; font-size: 12px; color: #64748B; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-header">
            <!-- 
                PALITAN ANG HREF DEPENDE SA CATEGORY:
                • Para sa Face: href="../face.html"
                • Para sa Eyes: href="../eyes.html"
                • Para sa Lips: href="../lips.html"
            -->
            <a href="../face.html" class="back-btn">← Back to Category</a>
        </div>

        <div class="product-detail-card">
            <!-- PALITAN ANG IMAGE URL, TITLE, AT DESCRIPTION -->
            <img src="https://images.unsplash.com/photo-1567928269937-23f2fef043a5?w=500&auto=format&fit=crop&q=80" alt="Product Image" class="product-img">
            <h1 class="product-title">Product Title Dito</h1>
            <p class="product-desc">
                Ilagay dito ang kumpletong detalye, benepisyo, at review ng produkto para sa iyong mga buyers.
            </p>

            <!-- PALITAN ANG AFFILIATE LINK -->
            <a href="ILAGAY_ANG_AFFILIATE_LINK_DITO" target="_blank" rel="noopener noreferrer" class="buy-btn">View On Store →</a>
        </div>

        <div class="footer">
            <p>© 2026 • As an affiliate, I earn from qualifying purchases.</p>
        </div>
    </div>

</body>
</html>
